<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block titulo %}EcoHarmony Park{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr/dist/l10n/es.js"></script>
    <link rel="icon" type="image/png" sizes="512x512" href="/static/img/favicon-eco-harmony.png">
    <link rel="stylesheet" href="/static/css/app.css">
</head>
<body>
    <header class="encabezado">
        <a class="marca-logo" href="/">
            <img
                class="marca-logo__imagen"
                src="/static/img/eco-harmony-park.png"
                alt="Logo de EcoHarmony Park"
                width="96"
                height="96"
            >
        </a>
        {% if usuario %}
        <div class="sesion-activa">
            <span>{{ usuario.email }}</span>
            <form method="post" action="/logout">
                <button class="boton-sesion" type="submit">Cerrar sesión</button>
            </form>
        </div>
        {% endif %}
    </header>

    <main class="contenedor">
        {% block contenido %}{% endblock %}
    </main>
</body>
</html>
